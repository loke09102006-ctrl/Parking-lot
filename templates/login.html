<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkOS — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a3a;
  --accent:#f5c842;--text:#e8e8f0;--muted:#6868a0;--danger:#ff4444;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.bg-grid{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(245,200,66,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,200,66,.04) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
.glow{
  position:fixed;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,200,66,.06) 0%,transparent 70%);
  top:-200px;right:-200px;pointer-events:none;
}
.login-wrap{
  width:100%;max-width:400px;position:relative;z-index:1;padding:24px;
}
.brand{text-align:center;margin-bottom:40px}
.brand-icon{
  width:56px;height:56px;background:var(--accent);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
}
.brand-icon svg{width:28px;height:28px;fill:var(--bg)}
.brand-name{font-size:2rem;font-weight:800;letter-spacing:4px;color:var(--accent)}
.brand-sub{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:2px;margin-top:4px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:36px;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.card-title{font-size:1rem;font-weight:700;margin-bottom:28px;letter-spacing:.5px}
.form-group{margin-bottom:18px}
.form-label{
  display:block;font-size:.65rem;font-family:'JetBrains Mono',monospace;
  color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;
}
.form-control{
  width:100%;padding:10px 14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:4px;color:var(--text);
  font-family:'Syne',sans-serif;font-size:.9rem;transition:border-color .2s;
}
.form-control:focus{outline:none;border-color:var(--accent)}
.btn{
  width:100%;padding:11px;border-radius:4px;border:none;
  background:var(--accent);color:var(--bg);font-family:'Syne',sans-serif;
  font-size:.9rem;font-weight:800;letter-spacing:1.5px;cursor:pointer;
  transition:all .2s;text-transform:uppercase;margin-top:8px;
}
.btn:hover{background:#e8b820;transform:translateY(-1px)}
.alert{
  background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);
  color:var(--danger);padding:10px 14px;border-radius:4px;
  font-size:.82rem;margin-bottom:20px;
}
.demo-creds{
  margin-top:24px;padding:16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;
}
.demo-title{font-size:.65rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.demo-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.75rem;font-family:'JetBrains Mono',monospace;padding:4px 0;cursor:pointer;
}
.demo-row:hover .demo-user{color:var(--accent)}
.demo-user{color:var(--text);transition:color .2s}
.demo-pass{color:var(--muted)}
.demo-role-badge{
  font-size:.6rem;padding:2px 6px;border-radius:2px;
  background:rgba(245,200,66,.1);color:var(--accent);border:1px solid rgba(245,200,66,.2);
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow"></div>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5h11L19 11M17.5 16a1.5 1.5 0 110-3 1.5 1.5 0 010 3m-11 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3M3 11l2-6h14l2 6v6H3v-6z"/></svg>
    </div>
    <div class="brand-name">PARKOS</div>
    <div class="brand-sub">PARKING MANAGEMENT SYSTEM</div>
  </div>
  <div class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <div class="card-title">Sign In to Continue</div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">→ Enter System</button>
    </form>
